<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mini coding agent</title>
<style>
  /* ------------------------------------------------------------------
     配色以南大紫为基调。--nju-purple 是唯一的主色源，想换成学校 VI 手册
     里的精确色值，只改这一行即可，其余色阶都是围绕它调出来的。
     ------------------------------------------------------------------ */
  :root {
    --nju-purple:       #63106E;   /* 南大紫 */
    --nju-purple-deep:  #43094B;
    --nju-purple-soft:  #8E4C9E;
    --nju-lavender:     #C79BD8;   /* 强调色：紫的亮调，用于工具名等 */

    --bg:          #12111A;
    --panel:       rgba(31, 21, 38, 0.86);
    --panel-2:     rgba(45, 31, 54, 0.88);
    --border:      #3B2A46;
    --border-soft: rgba(199, 155, 216, 0.16);
    --text:        #EDE7F1;
    --dim:         #A798B2;
    --green:       #6FD79A;
    --red:         #FF8A8A;
    --gold:        #E3BE7C;
  }
  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.65 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  /* 水印：北大楼，锚在右下角。
     试过铺满整屏，结果不是水印是壁纸：正文全程压在照片上，而且宽屏下裁切
     过度，建筑本身反而认不出来。改成右下角定位 + 径向遮罩柔化边缘，
     既保住了北大楼的轮廓，又把左上方的正文区域完全让了出来。 */
  body::before {
    content: "";
    position: fixed;
    right: -24px;
    bottom: 44px;              /* 抬高一点，避开底部输入区，别被它的半透明面板压住 */
    width: min(56vw, 780px);
    aspect-ratio: 3 / 2;
    background: url("/static/nju-beidalou.jpg") center 32% / cover no-repeat;
    opacity: .55;
    /* 关键是 brightness：原图天空是亮色，直接铺上来会和浅色正文抢，
       字压在上面读不清。压暗之后建筑的暗部轮廓仍在，亮部不再刺眼，
       浅色文字压上去也保得住对比度。 */
    filter: brightness(.44) saturate(.95) contrast(1.14);
    /* 遮罩要在元素边界内就淡透，否则上边缘会留下一道可见的硬边。
       实心核心保住建筑主体，四周充分淡出。 */
    -webkit-mask-image: radial-gradient(ellipse at 58% 60%, #000 20%, transparent 68%);
    mask-image: radial-gradient(ellipse at 58% 60%, #000 20%, transparent 68%);
    pointer-events: none;
    z-index: 0;
  }
  /* 左上角只留一丝紫，作为呼应而非背景色——紫是点缀色，不该糊满主区域 */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    background: radial-gradient(52% 40% at 4% 0%, rgba(99,16,110,.14) 0%, transparent 66%);
    pointer-events: none;
    z-index: 0;
  }
  body > * { position: relative; z-index: 1; }

  code, pre, .mono { font-family: "Cascadia Code", Consolas, "Courier New", monospace; }

  /* ---------- 顶栏 ---------- */
  header {
    background: linear-gradient(90deg,
        rgba(67,9,75,.88) 0%, rgba(99,16,110,.52) 38%, rgba(26,22,36,.88) 100%);
    border-bottom: 1px solid var(--border-soft);
    padding: 11px 20px;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    backdrop-filter: blur(2px);
  }
  .brand {
    font-weight: 600; font-size: 16.5px; letter-spacing: .3px;
    display: flex; align-items: center; gap: 9px;
  }
  .brand::before {
    content: ""; width: 3px; height: 17px; border-radius: 2px;
    background: linear-gradient(var(--nju-lavender), var(--nju-purple-soft));
  }
  .meta { color: var(--dim); font-size: 12.5px; }
  header .spacer { flex: 1; }

  select, button {
    background: rgba(199,155,216,.08);
    color: var(--text);
    border: 1px solid var(--border-soft);
    border-radius: 7px;
    padding: 5px 12px; font-size: 13px; cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  select:hover, button:hover {
    border-color: var(--nju-lavender);
    background: rgba(199,155,216,.16);
  }
  button:disabled { opacity: .4; cursor: not-allowed; }
  select option { background: #2A1C33; color: var(--text); }

  .ctx { display: flex; align-items: center; gap: 9px; font-size: 12.5px; color: var(--dim); }
  .bar {
    width: 140px; height: 6px; border-radius: 4px;
    background: rgba(199,155,216,.14); overflow: hidden;
  }
  .bar > i {
    display: block; height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--nju-purple-soft), var(--nju-lavender));
    transition: width .35s ease, background .35s ease;
  }
  .bar.warn > i { background: linear-gradient(90deg, var(--gold), #F2D9A6); }

  /* ---------- 主体 ---------- */
  .body { flex: 1; display: flex; min-height: 0; }

  aside {
    width: 262px; flex: none;
    background: var(--panel);
    border-right: 1px solid var(--border-soft);
    display: flex; flex-direction: column;
    backdrop-filter: blur(2px);
  }
  .aside-head {
    padding: 11px 13px; border-bottom: 1px solid var(--border-soft);
    display: flex; align-items: center; gap: 8px;
  }
  .aside-head .title {
    font-size: 12px; color: var(--nju-lavender); flex: 1;
    letter-spacing: 1.2px; text-transform: uppercase;
  }
  .aside-head button { padding: 3px 9px; font-size: 12px; }
  .ws-path {
    padding: 8px 13px; font-size: 11.5px; color: var(--dim);
    border-bottom: 1px solid var(--border-soft);
    word-break: break-all; line-height: 1.5;
  }
  .tree { flex: 1; overflow: auto; padding: 9px 7px 18px; font-size: 13px; }
  .node {
    padding: 2.5px 7px; border-radius: 5px; cursor: pointer; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  .node:hover { background: rgba(199,155,216,.12); }
  .node.dir { color: var(--text); }
  .node.file { color: var(--dim); }
  .node .caret { display: inline-block; width: 13px; color: var(--nju-purple-soft); }
  .children.collapsed { display: none; }
  .tree-empty { color: var(--dim); font-size: 12.5px; padding: 10px 9px; }

  main { flex: 1; overflow-y: auto; padding: 22px 20px 8px; min-width: 0; }
  .stream { max-width: 860px; margin: 0 auto; }
  .msg { margin-bottom: 16px; }
  .msg.user {
    background: var(--panel-2);
    border-left: 3px solid var(--nju-purple-soft);
    padding: 10px 14px; border-radius: 0 9px 9px 0; white-space: pre-wrap;
  }
  .msg.assistant { white-space: pre-wrap; }
  .msg.assistant code {
    background: rgba(199,155,216,.14); color: var(--nju-lavender);
    padding: 1px 5px; border-radius: 4px; font-size: 13px;
    font-family: "Cascadia Code", Consolas, monospace;
  }
  .msg.assistant pre.code {
    background: rgba(18,12,23,.72); border: 1px solid var(--border-soft);
    border-radius: 8px; padding: 11px 13px; margin: 9px 0;
    overflow-x: auto; font-size: 13px; line-height: 1.55; white-space: pre;
    font-family: "Cascadia Code", Consolas, monospace;
  }
  .msg.assistant strong { color: #fff; font-weight: 600; }
  .msg.notice { color: var(--gold); font-size: 13.5px; }
  .msg.error { color: var(--red); font-size: 13.5px; }
  .msg.stats {
    color: var(--dim); font-size: 12.5px;
    border-top: 1px solid var(--border-soft); padding-top: 9px;
  }

  .tool {
    background: var(--panel);
    border: 1px solid var(--border-soft);
    border-radius: 9px; padding: 10px 14px; margin-bottom: 10px;
  }
  .tool .head { display: flex; align-items: center; gap: 9px; font-size: 13.5px; }
  .tool .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--gold); flex: none;
    box-shadow: 0 0 0 3px rgba(227,190,124,.14);
  }
  .tool.done .dot { background: var(--green); box-shadow: 0 0 0 3px rgba(111,215,154,.14); }
  .tool.fail .dot { background: var(--red);   box-shadow: 0 0 0 3px rgba(255,138,138,.14); }
  .tool .name { color: var(--nju-lavender); font-weight: 600; }
  .tool .args { color: var(--dim); font-size: 12.5px; overflow: hidden;
                text-overflow: ellipsis; white-space: nowrap; }
  .tool .result { color: var(--dim); font-size: 12.5px; margin-top: 6px; padding-left: 17px; }
  .tool.fail .result { color: var(--red); }

  /* ---------- 弹窗 ---------- */
  .overlay {
    position: fixed; inset: 0; background: rgba(12,7,16,.72);
    display: none; align-items: center; justify-content: center;
    padding: 24px; z-index: 20; backdrop-filter: blur(3px);
  }
  .overlay.show { display: flex; }
  .dialog {
    background: #1E1526;
    border: 1px solid var(--border);
    border-radius: 12px; width: min(830px, 100%); max-height: 82vh;
    display: flex; flex-direction: column;
    box-shadow: 0 18px 50px rgba(0,0,0,.5);
  }
  .dialog.warn { border-color: rgba(227,190,124,.5); }
  .dialog h3 {
    margin: 0; padding: 14px 18px;
    border-bottom: 1px solid var(--border-soft);
    font-size: 15px; word-break: break-all; font-weight: 600;
  }
  .dialog .body { overflow: auto; padding: 14px 18px; }
  .dialog pre { margin: 0; font-size: 13px; line-height: 1.55;
                white-space: pre-wrap; word-break: break-all; }
  .dialog .foot {
    padding: 13px 18px; border-top: 1px solid var(--border-soft);
    display: flex; gap: 10px; justify-content: flex-end; align-items: center;
  }
  .btn-yes    { border-color: rgba(111,215,154,.55); color: var(--green); }
  .btn-always { border-color: rgba(199,155,216,.55); color: var(--nju-lavender); }
  .btn-no     { border-color: rgba(255,138,138,.5);  color: var(--red); }
  .diff-add  { color: var(--green); }
  .diff-del  { color: var(--red); }
  .diff-hunk { color: var(--nju-lavender); }

  .picker-cur { color: var(--dim); font-size: 12.5px; padding: 0 18px 10px; word-break: break-all; }
  .picker-list { max-height: 46vh; overflow: auto; padding: 0 9px; }
  .picker-item { padding: 6px 11px; border-radius: 6px; cursor: pointer; font-size: 13.5px; }
  .picker-item:hover { background: rgba(199,155,216,.13); }
  .picker-item.up { color: var(--nju-lavender); }

  /* ---------- 输入区 ---------- */
  footer {
    border-top: 1px solid var(--border-soft);
    background: var(--panel);
    padding: 13px 20px; backdrop-filter: blur(2px);
  }
  .inputbar { max-width: 860px; margin: 0 auto; display: flex; gap: 10px; }
  textarea {
    flex: 1; resize: none;
    background: rgba(45,31,54,.75); color: var(--text);
    border: 1px solid var(--border-soft); border-radius: 9px;
    padding: 10px 13px; font: inherit; line-height: 1.5; max-height: 160px;
  }
  textarea:focus {
    outline: none; border-color: var(--nju-purple-soft);
    box-shadow: 0 0 0 3px rgba(142,76,158,.18);
  }
  #sendBtn {
    background: linear-gradient(135deg, var(--nju-purple), var(--nju-purple-soft));
    border-color: transparent; color: #fff; font-weight: 600; padding: 5px 20px;
  }
  #sendBtn:hover:not(:disabled) {
    background: linear-gradient(135deg, var(--nju-purple-soft), var(--nju-lavender));
  }
  .hint { max-width: 860px; margin: 7px auto 0; color: var(--dim); font-size: 11.5px; }

  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-thumb { background: rgba(199,155,216,.20); border-radius: 5px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(199,155,216,.34); }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>

<header>
  <span class="brand">mini coding agent</span>
  <span class="meta" id="meta">连接中…</span>
  <span class="spacer"></span>
  <div class="ctx">
    <span>上下文</span>
    <span class="bar" id="ctxBar"><i></i></span>
    <span id="ctxText">0 / 0</span>
  </div>
  <select id="modeSel" title="权限模式">
    <option value="ask">ask · 逐次确认</option>
    <option value="auto">auto · 全自动</option>
    <option value="readonly">readonly · 只读</option>
  </select>
  <button id="compactBtn" title="立即压缩上下文">压缩上下文</button>
</header>

<div class="body">
  <aside>
    <div class="aside-head">
      <span class="title">工作目录</span>
      <button id="pickBtn" title="切换工作目录">切换</button>
      <button id="refreshBtn" title="刷新文件树">刷新</button>
    </div>
    <div class="ws-path" id="wsPath">—</div>
    <div class="tree" id="tree"></div>
  </aside>

  <main><div class="stream" id="stream"></div></main>
</div>

<footer>
  <div class="inputbar">
    <textarea id="input" rows="1" placeholder="描述一个编程任务，回车发送（Shift+回车换行）"></textarea>
    <button id="sendBtn">发送</button>
  </div>
  <div class="hint">agent 在本机 Python 进程内运行，浏览器只是显示层</div>
</footer>

<!-- 写操作确认 -->
<div class="overlay" id="overlay">
  <div class="dialog warn">
    <h3 id="dlgTitle">需要确认</h3>
    <div class="body"><pre id="dlgBody" class="mono"></pre></div>
    <div class="foot">
      <button class="btn-no"     data-answer="n">拒绝</button>
      <button class="btn-always" data-answer="a">本会话总是允许</button>
      <button class="btn-yes"    data-answer="y">允许</button>
    </div>
  </div>
</div>

<!-- 文件预览 -->
<div class="overlay" id="preview">
  <div class="dialog">
    <h3 id="pvTitle">文件</h3>
    <div class="body"><pre id="pvBody" class="mono"></pre></div>
    <div class="foot"><button id="pvClose">关闭</button></div>
  </div>
</div>

<!-- 目录选择器 -->
<div class="overlay" id="picker">
  <div class="dialog">
    <h3>选择工作目录</h3>
    <div class="picker-cur" id="pkCur"></div>
    <div class="picker-list" id="pkList"></div>
    <div class="foot">
      <span class="meta spacer" style="flex:1">agent 只能读写选定目录内的文件</span>
      <button id="pkCancel">取消</button>
      <button id="pkChoose" class="btn-yes">选择当前目录</button>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const stream = $("stream");
let ws, streamingEl = null, streamingRaw = "", busy = false, lastTool = null;
let pickerPath = "";

/* ---------- 通用 ---------- */
function scrollDown() {
  const main = document.querySelector("main");
  main.scrollTop = main.scrollHeight;
}
function addBlock(cls, text) {
  const el = document.createElement("div");
  el.className = "msg " + cls;
  el.textContent = text;
  stream.appendChild(el);
  scrollDown();
  return el;
}
function escapeHtml(s) {
  return s.replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
/* 只做最轻量的行内渲染：代码块、行内 code、粗体。
   不引 markdown 库——流式输出下整段重渲染，复杂解析器反而容易在半截语法上出错。 */
function renderInline(text) {
  let h = escapeHtml(text);
  h = h.replace(/```[a-zA-Z]*\n?([\s\S]*?)```/g, (m, code) => `<pre class="code">${code}</pre>`);
  h = h.replace(/`([^`\n]+)`/g, "<code>$1</code>");
  h = h.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
  return h;
}
function fmtArgs(args) {
  return Object.entries(args || {}).map(([k, v]) => {
    let s = typeof v === "string" ? v : JSON.stringify(v);
    if (s.length > 70) s = s.slice(0, 67) + "…";
    return k + "=" + s;
  }).join("  ");
}
function renderDiff(text) {
  const frag = document.createDocumentFragment();
  for (const line of text.split("\n")) {
    const span = document.createElement("span");
    if (line.startsWith("+++") || line.startsWith("---")) span.className = "";
    else if (line.startsWith("+")) span.className = "diff-add";
    else if (line.startsWith("-")) span.className = "diff-del";
    else if (line.startsWith("@@")) span.className = "diff-hunk";
    span.textContent = line + "\n";
    frag.appendChild(span);
  }
  return frag;
}

/* ---------- 文件树 ---------- */
async function loadTree() {
  const box = $("tree");
  try {
    const data = await (await fetch("/api/tree")).json();
    box.textContent = "";
    if (data.error) { box.innerHTML = `<div class="tree-empty">${data.error}</div>`; return; }
    if (!data.children.length) { box.innerHTML = `<div class="tree-empty">（空目录）</div>`; return; }
    box.appendChild(renderNodes(data.children, 0));
  } catch (err) {
    box.innerHTML = `<div class="tree-empty">读取失败</div>`;
  }
}
function renderNodes(nodes, level) {
  const frag = document.createDocumentFragment();
  for (const node of nodes) {
    const row = document.createElement("div");
    row.className = "node " + node.type;
    row.style.paddingLeft = (level * 12 + 6) + "px";
    if (node.type === "dir") {
      row.innerHTML = `<span class="caret">▾</span>`;
      row.appendChild(document.createTextNode(node.name + "/"));
      const kids = document.createElement("div");
      kids.className = "children";
      kids.appendChild(renderNodes(node.children || [], level + 1));
      row.onclick = (ev) => {
        ev.stopPropagation();
        kids.classList.toggle("collapsed");
        row.querySelector(".caret").textContent =
          kids.classList.contains("collapsed") ? "▸" : "▾";
      };
      frag.appendChild(row);
      frag.appendChild(kids);
    } else {
      row.innerHTML = `<span class="caret"></span>`;
      row.appendChild(document.createTextNode(node.name));
      row.onclick = (ev) => { ev.stopPropagation(); openFile(node.path); };
      frag.appendChild(row);
    }
  }
  return frag;
}
async function openFile(path) {
  const data = await (await fetch("/api/file?path=" + encodeURIComponent(path))).json();
  $("pvTitle").textContent = path;
  $("pvBody").textContent = data.error
    ? data.error
    : data.content + (data.truncated ? "\n\n…（文件过大，已截断）" : "");
  $("preview").classList.add("show");
}
$("pvClose").onclick = () => $("preview").classList.remove("show");
$("refreshBtn").onclick = loadTree;

/* ---------- 目录选择器 ---------- */
async function openPicker(path) {
  const data = await (await fetch("/api/browse?path=" + encodeURIComponent(path || ""))).json();
  if (data.error) { alert(data.error); return; }
  pickerPath = data.path;
  $("pkCur").textContent = data.path || "（选择一个磁盘）";
  $("pkChoose").disabled = !data.path;

  const list = $("pkList");
  list.textContent = "";
  if (data.parent !== null && data.parent !== undefined) {
    const up = document.createElement("div");
    up.className = "picker-item up";
    up.textContent = "⬑ 上一级";
    up.onclick = () => openPicker(data.parent);
    list.appendChild(up);
  }
  for (const d of data.dirs) {
    const item = document.createElement("div");
    item.className = "picker-item";
    item.textContent = "📁 " + d.name;
    item.onclick = () => openPicker(d.path);
    list.appendChild(item);
  }
  $("picker").classList.add("show");
}
$("pickBtn").onclick = () => openPicker(currentWorkspace);
$("pkCancel").onclick = () => $("picker").classList.remove("show");
$("pkChoose").onclick = () => {
  if (!pickerPath) return;
  ws.send(JSON.stringify({ type: "set_workspace", path: pickerPath }));
  $("picker").classList.remove("show");
};

/* ---------- WebSocket ---------- */
let currentWorkspace = "";

function connect() {
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onmessage = (ev) => handle(JSON.parse(ev.data));
  ws.onclose = () => addBlock("error", "连接已断开，刷新页面可重连");
}

function handle(e) {
  switch (e.type) {
    case "ready":
      currentWorkspace = e.workspace;
      $("meta").textContent = `${e.model} · ${e.tools.length} 个工具`;
      $("wsPath").textContent = e.workspace;
      $("modeSel").value = e.mode;
      loadTree();
      break;

    case "workspace_changed":
      addBlock("notice", "! 工作目录已切换到 " + e.workspace + "，对话历史已重置");
      break;

    case "text":
      if (!streamingEl) { streamingEl = addBlock("assistant", ""); streamingRaw = ""; }
      streamingRaw += e.delta;
      streamingEl.innerHTML = renderInline(streamingRaw);
      scrollDown();
      break;

    case "text_end":
      streamingEl = null;
      streamingRaw = "";
      break;

    case "tool_start": {
      const el = document.createElement("div");
      el.className = "tool";
      el.innerHTML = `<div class="head"><span class="dot"></span>` +
                     `<span class="name"></span><span class="args"></span></div>`;
      el.querySelector(".name").textContent = e.name;
      el.querySelector(".args").textContent = fmtArgs(e.args);
      stream.appendChild(el);
      lastTool = el;
      scrollDown();
      break;
    }

    case "tool_end":
      if (lastTool) {
        lastTool.classList.add(e.is_error ? "fail" : "done");
        const r = document.createElement("div");
        r.className = "result";
        r.textContent = e.summary;
        lastTool.appendChild(r);
        lastTool = null;
        scrollDown();
      }
      break;

    case "tree_dirty": loadTree(); break;
    case "notice": addBlock("notice", "! " + e.message); break;
    case "error":  addBlock("error",  "✗ " + e.message); break;

    case "context": {
      const pct = e.limit ? Math.min(100, (e.used / e.limit) * 100) : 0;
      $("ctxBar").querySelector("i").style.width = pct + "%";
      $("ctxBar").classList.toggle("warn", pct >= 75);
      $("ctxText").textContent = `${e.used} / ${e.limit}`;
      break;
    }

    case "approval_request":
      $("dlgTitle").textContent = e.title;
      $("dlgBody").textContent = "";
      $("dlgBody").appendChild(
        e.tool === "run_command" ? document.createTextNode(e.detail) : renderDiff(e.detail)
      );
      $("overlay").classList.add("show");
      break;

    case "turn_end": {
      let line = `${e.steps} 步 · ${e.tool_calls} 次工具调用 · ${e.tokens} tokens`;
      if (e.compaction_tokens) line += `（另有 ${e.compaction_tokens} tokens 用于上下文压缩）`;
      addBlock("stats", line);
      setBusy(false);
      break;
    }
  }
}

/* ---------- 交互 ---------- */
function setBusy(v) {
  busy = v;
  $("sendBtn").disabled = v;
  $("input").disabled = v;
  $("pickBtn").disabled = v;
  if (!v) $("input").focus();
}
function send() {
  const box = $("input");
  const text = box.value.trim();
  if (!text || busy || !ws || ws.readyState !== 1) return;
  addBlock("user", text);
  ws.send(JSON.stringify({ type: "user_input", text }));
  box.value = "";
  box.style.height = "auto";
  setBusy(true);
}
$("sendBtn").onclick = send;
$("input").addEventListener("keydown", (ev) => {
  if (ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); send(); }
});
$("input").addEventListener("input", function () {
  this.style.height = "auto";
  this.style.height = Math.min(this.scrollHeight, 160) + "px";
});
document.querySelectorAll("#overlay .foot button").forEach((btn) => {
  btn.onclick = () => {
    ws.send(JSON.stringify({ type: "approval_response", answer: btn.dataset.answer }));
    $("overlay").classList.remove("show");
  };
});
$("modeSel").onchange = (ev) => ws.send(JSON.stringify({ type: "set_mode", mode: ev.target.value }));
$("compactBtn").onclick = () => ws.send(JSON.stringify({ type: "compact" }));

connect();
$("input").focus();
</script>
</body>
